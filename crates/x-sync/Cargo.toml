[package]
name = "ratatoskr-x-sync"
description = "Authoritative, resumable full bookmark snapshots from the official X API"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "x_sync"
path = "src/lib.rs"

[dependencies]
chrono.workspace                    = true
ratatoskr-document-contracts.workspace = true
ratatoskr-event-envelope.workspace  = true
ratatoskr-identifiers.workspace     = true
ratatoskr-operation-contracts.workspace = true
ratatoskr-social-contracts.workspace = true
ratatoskr-x-budget.workspace        = true
ratatoskr-x-normalize.workspace     = true
ratatoskr-x-oauth.workspace         = true
ratatoskr-x-persistence.workspace   = true
reqwest.workspace                   = true
serde.workspace                     = true
serde_json.workspace                = true
sha2.workspace                      = true
sqlx.workspace                      = true
thiserror.workspace                 = true
tokio = { workspace = true, features = ["sync"] }
uuid.workspace                      = true

[dev-dependencies]
ratatoskr-x-persistence = { workspace = true, features = ["test-support"] }
wiremock.workspace = true

[lints]
workspace = true
