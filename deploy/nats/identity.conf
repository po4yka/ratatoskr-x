# Merge this public-nkey identity into the host NATS `authorization.users` list; the deployed ACL is
# `deploy/nats/ratatoskr.conf` in ratatoskr-platform and this stanza is a byte-equal copy of its X
# entry (XR-021 CONTRACTS.md sections S03 and R3-01). The seed stays in `/etc/ratatoskr/x.nkey`,
# named by `RATATOSKR__BUS__NKEY_SEED_PATH`; replace only the non-secret public-key placeholder.
#
# X consumes the Edge-provisioned durables `ratatoskr_x_browser_capture` (commands stream),
# `ratatoskr_x_extractor_reports` and `ratatoskr_x_deletion_acks` (events stream; the second carries
# Knowledge's acknowledgement of a removal, CONTRACTS.md R5-11) and publishes its own facts,
# operation reports and the generic capture command for a linked article. It subscribes only to its
# own inbox prefix `_INBOX_x`, which the service sets with `custom_inbox_prefix` in `services/x/src/bus.rs`; a
# service built without the prefix cannot complete a JetStream request under this stanza. A denied
# publish is visible only in the NATS server log as a `Publish Violation`.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_X_XXXXXXXXXXXXX
    permissions: {
        publish: {
            allow: [
                "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_x_browser_capture",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_x_browser_capture",
                "$JS.ACK.ratatoskr_commands.ratatoskr_x_browser_capture.>",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_x_extractor_reports",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_x_extractor_reports",
                "$JS.ACK.ratatoskr_events.ratatoskr_x_extractor_reports.>",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_x_deletion_acks",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_x_deletion_acks",
                "$JS.ACK.ratatoskr_events.ratatoskr_x_deletion_acks.>",
                "evt.platform.operation.reported.v1",
                "evt.social.source.captured.v1",
                "evt.social.source.updated.v1",
                "evt.social.source.removed.v1",
                "cmd.content.capture.requested.v1",
            ]
        }
        subscribe: { allow: ["_INBOX_x.>"] }
    }
}
