[package]
name = "ratatoskr-x"
description = "The ratatoskr-x service binary"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "ratatoskr-x"
path = "src/main.rs"

[[bin]]
name = "ratatoskr-x-transition"
path = "src/transition_main.rs"

[dependencies]
async-nats.workspace = true
axum.workspace = true
chrono.workspace = true
futures-util.workspace = true
ratatoskr-x-budget.workspace = true
ratatoskr-x-core.workspace = true
ratatoskr-x-capture.workspace = true
ratatoskr-x-http.workspace = true
ratatoskr-x-oauth.workspace = true
# The disposable-database harness stays out: this dependency never enables test-support.
ratatoskr-x-persistence.workspace = true
ratatoskr-x-sync.workspace = true
ratatoskr-x-telemetry.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace   = true
uuid.workspace      = true

[dev-dependencies]
ratatoskr-x-persistence = { workspace = true, features = ["test-support"] }
ratatoskr-event-envelope.workspace = true
ratatoskr-operation-contracts.workspace = true
ratatoskr-social-contracts.workspace = true
sqlx.workspace = true
wiremock.workspace = true
nkeys = "0.4.5"
uuid.workspace = true

[lints]
workspace = true
