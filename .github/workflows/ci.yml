# The gate DEVELOPMENT.md documents, enforced. The command list here and the command list in
# DEVELOPMENT.md are the same list; if they drift, DEVELOPMENT.md is wrong.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# SECURITY.md: deny by default. The gate reads the tree and needs nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On a pull request the newest push is the only one whose answer matters, and cancelling the
  # superseded run is what makes the queue keep up. On `main` it is the opposite: a cancelled run
  # leaves that commit with no verdict at all, and `main` is the branch whose history is supposed to
  # record whether each commit passed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The integration suite talks to a real PostgreSQL on purpose: queries are runtime-checked, so
    # this service is what replaces the compile-time checking the `sqlx::query!` macros would have
    # given. Without it the suite does not run and the queries are unverified.
    services:
      postgres:
        # Pinned by digest, not by tag. A service container runs on the runner beside the checkout
        # and the build, on the same network. This digest is `postgres:17` as it stood on 2026-08-19
        # (PostgreSQL 17.11), the same pin every Ratatoskr service carries. zizmor reports the tag
        # form as `unpinned-images`.
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: x
          POSTGRES_PASSWORD: x
          POSTGRES_DB: x
          # Byte-identical to what DEVELOPMENT.md documents for laptops. Without it this cluster is
          # created with the runner's glibc collation while a developer's is created with ICU, so a
          # text index sorts differently in the two places that are supposed to be checking each
          # other.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U x -d x"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    env:
      # Where the suite creates and drops its disposable databases.
      X_TEST_DATABASE_URL: postgres://x:x@127.0.0.1:5432/x
      X_TEST_NATS_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate reads the tree and pushes nothing, so the checkout credential is left behind in
          # .git/config for no reason. Deny by default applies to the token too.
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show           # rust-toolchain.toml is the only supported toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine --jetstream
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 4222; then exit 0; fi
            sleep 1
          done
          docker logs nats >&2
          exit 1

      - run: cargo fetch --locked

      # Reads RustSec, the licence set, duplicate versions and the source policy.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The one size limit clippy cannot express: a module can pass every clippy threshold and
      # still be a god-module. A ratchet, not a target, matching the other Ratatoskr repositories.
      - run: git ls-files -z "*.rs" | xargs -0 -r wc -l | awk '$2 != "total" && $1 > 850 { print; bad = 1 } END { exit bad }'

      # Before the tests: the smoke test executes the ratatoskr-x binary as a child process, and
      # `cargo test` builds only the binary of the package under test.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release

      # This file and DEVELOPMENT.md are one list by rule, and the rule had no enforcement. The awk
      # is scoped to the `gate` job: DEVELOPMENT.md documents THIS job's command list.
      - name: The gate and DEVELOPMENT.md are one list
        run: |
          set -euo pipefail
          in_ci=$(awk '
            /^  [a-z][a-z0-9_-]*:[[:space:]]*$/ { in_gate = ($0 ~ /^  gate:[[:space:]]*$/) }
            in_gate && /^[[:space:]]+- run: cargo / { sub(/^[[:space:]]+- run: /, ""); print }
          ' .github/workflows/ci.yml)
          in_doc=$(awk '/^### Rust — also the CI gate/{f=1} f&&/^cargo /{print} f&&/^```$/{exit}' \
                   DEVELOPMENT.md)
          if [ "$in_ci" != "$in_doc" ]; then
            echo "::error::ci.yml and DEVELOPMENT.md have drifted. DEVELOPMENT.md is the one that is wrong."
            diff <(echo "$in_ci") <(echo "$in_doc") || true
            exit 1
          fi
          echo "the two lists are identical:"
          echo "$in_ci" | awk '{print "  " $0}'
